[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signspeak-api"
version = "0.1.0"
description = "SignSpeak optional backend: feedback collection and landmark-only recognition for research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# PostgreSQL driver for deployments (DATABASE_URL=postgresql+psycopg://...).
postgres = ["psycopg[binary]>=3.1"]
# Server-side recognition with a model pack (pulls in PyTorch via signspeak-ml).
ml = ["signspeak-ml"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["signspeak_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
